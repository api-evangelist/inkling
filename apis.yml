name: Inkling
description: 'Inkling is a frontline employee training and enablement platform (now part of Echo360)
  that delivers mission-critical knowledge, learning pathways, and operational workflows to essential
  workers across retail, hospitality, healthcare, and manufacturing. Its products include the Habitat
  content authoring tool, mobile Knowledge & Training modules, InkForms operational checklists,
  certification pathways, reporting and analytics, and LMS/LXP integrations. Inkling publishes no public
  developer API, OpenAPI specification, SDK, or developer portal; integration is delivered through LMS/LXP
  connectors and professional services. This API Evangelist profile was surfaced as a Sapphire Ventures
  portfolio company and enriched with the provider''s public identity, security posture, and site
  properties.'
